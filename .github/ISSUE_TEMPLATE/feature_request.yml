name: Feature request
description: Propose a focused converter, contract, validation, or documentation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the real workflow or failure mode, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected outputs, warnings, failure behavior, and provenance requirements.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PDF
        - Image OCR
        - DOCX
        - XLSX or XLSM
        - PPTX
        - CSV, JSON, or EML
        - Canonical schemas
        - Chunking or RAG
        - Bundle validation
        - Packaging or release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Mention existing engines, workarounds, performance costs, or compatibility risks.
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
      description: List deterministic tests that would prove the feature is complete.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the capability matrix.
          required: true
        - label: This request does not depend on a confidential fixture.
          required: true
