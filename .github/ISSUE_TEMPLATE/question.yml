name: Question
description: Ask for help using or understanding the project
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Read `SUPPORT.md`, `README.md`, and the capability matrix first. Do not upload confidential documents.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to convert, validate, or integrate?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you tried
      description: Include commands, version, capability-probe result, and relevant warning codes.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Specific question
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed confidential information, credentials, and document contents.
          required: true
