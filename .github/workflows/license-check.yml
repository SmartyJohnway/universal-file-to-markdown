name: License files

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Apache-2.0 metadata
        run: |
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0" LICENSE
          grep -q "Apache-2.0" LICENSES.md
          grep -q "Apache License 2.0" THIRD_PARTY_NOTICES.md
