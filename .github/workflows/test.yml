name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capability preflight
        run: python scripts/capability_probe.py --json
      - name: Validate release truth consistency
        run: python scripts/check_release_consistency.py
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
