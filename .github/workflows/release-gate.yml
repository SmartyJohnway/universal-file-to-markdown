name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capability preflight
        run: python scripts/capability_probe.py --json
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Validate citation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('CITATION.cff').read_text(encoding='utf-8')
          required = ['cff-version: 1.2.0', 'version: 1.6.0', 'license: Apache-2.0']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing citation metadata: ' + ', '.join(missing))
          PY
      - name: Validate release files
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.zh-TW.md
          test -f CHANGELOG.md
          test -f CHANGELOG.zh-TW.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f RELEASING.md
