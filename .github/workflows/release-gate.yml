name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capability preflight
        run: python scripts/capability_probe.py --json
      - name: Validate release truth consistency
        run: python scripts/check_release_consistency.py
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Validate citation metadata
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          published = re.search(r'^published_stable_version:\s*(\S+)\s*$', Path('SKILL.md').read_text(encoding='utf-8'), re.MULTILINE)
          required = ['cff-version: 1.2.0', 'license: Apache-2.0']
          missing = [item for item in required if item not in citation]
          if not published or f'version: {published.group(1)}' not in citation:
              missing.append('CITATION.cff published stable version')
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', version):
              missing.append('VERSION semver')
          if missing:
              raise SystemExit('Missing or invalid citation metadata: ' + ', '.join(missing))
          PY
      - name: Validate release files
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.zh-TW.md
          test -f CHANGELOG.md
          test -f CHANGELOG.zh-TW.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f RELEASING.md
