name: Markdown links

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository-local Markdown links
        run: python scripts/check_markdown_links.py .
      - name: Validate release truth consistency
        run: python scripts/check_release_consistency.py
