name: Markdown links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-link-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --accept 200,204,206,429
            "**/*.md"
          fail: true
