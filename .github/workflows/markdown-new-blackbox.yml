name: markdown.new black-box benchmark

on:
  push:
    branches:
      - benchmark/markdown-new-blackbox-20260725
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixture dependencies
        run: python -m pip install --disable-pip-version-check python-docx openpyxl python-pptx

      - name: Run black-box benchmark
        run: python benchmarks/markdown_new_blackbox.py

      - name: Show report
        if: always()
        run: |
          cat benchmarks/results/REPORT.md || true
          echo '--- summary.json ---'
          cat benchmarks/results/summary.json || true

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-new-blackbox-results
          path: |
            benchmarks/fixtures/
            benchmarks/results/
          if-no-files-found: error
          retention-days: 14
