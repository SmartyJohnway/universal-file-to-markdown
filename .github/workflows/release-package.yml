name: Build release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release files
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.zh-TW.md
          test -f CHANGELOG.md
          test -f CHANGELOG.zh-TW.md
          test -f CITATION.cff
      - name: Build and validate canonical release package
        run: |
          python scripts/build_skill_package.py --profile release --output dist --verify
          python scripts/build_skill_package.py --profile agent-skill --output dist --verify
          python scripts/validate_skill_package.py --profile release "dist/universal-file-to-markdown-$(tr -d '\n' < VERSION)-release.zip"
          python scripts/validate_skill_package.py --profile agent-skill "dist/universal-file-to-markdown-$(tr -d '\n' < VERSION)-skill.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: universal-file-to-markdown-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
